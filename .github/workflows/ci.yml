name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compila e roda os testes
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Relatório dos testes em caso de falha
        if: failure()
        run: cat target/surefire-reports/*.txt || true

  docker:
    name: Docker Compose (MySQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cria o .env com uma chave temporária
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" > .env

      - name: Sobe o MySQL e a API
        run: docker compose up -d --build --wait

      - name: Testa o fluxo completo na API
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/actuator/health && break
            sleep 2
          done
          curl -fs -X POST http://localhost:8080/auth/registro -H 'Content-Type: application/json' \
            -d '{"nome":"CI","email":"ci@exemplo.com","senha":"senha-do-ci"}'
          TOKEN=$(curl -fs -X POST http://localhost:8080/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@exemplo.com","senha":"senha-do-ci"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')
          curl -fs -X POST http://localhost:8080/tarefas -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d '{"titulo":"Tarefa do CI","prioridade":"ALTA"}'
          curl -fs http://localhost:8080/tarefas -H "Authorization: Bearer $TOKEN" | grep -q 'Tarefa do CI'

      - name: Logs em caso de erro
        if: failure()
        run: docker compose logs

      - name: Derruba os containers
        if: always()
        run: docker compose down -v
