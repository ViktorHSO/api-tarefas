server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/tarefas -> http://api:8080/tarefas (mesma origem: sem CORS)
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome podem ficar em cache por bastante tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O React Router cuida das rotas: qualquer outro caminho cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
